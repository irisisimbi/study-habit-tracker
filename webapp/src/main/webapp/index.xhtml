<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/template.xhtml">
    <ui:define name="title">Home - Study Habit Tracker</ui:define>
    <ui:define name="content">
        <div class="card">
            <h2 class="page-title">Welcome</h2>
            <p>
                The Personal Study Habit Tracker helps students build consistent study habits by
                logging study sessions across subjects, tracking progress over time, and viewing
                total hours spent per subject.
            </p>
            <!-- inline CSS example -->
            <p style="font-style: italic; color:#2f6fed;">
                Use the navigation bar above to manage Subjects and Study Sessions.
            </p>
            <h:link outcome="/subject-list" value="Manage Subjects" styleClass="btn btn-primary" style="margin-right:10px;"/>
            <h:link outcome="/session-list" value="Manage Study Sessions" styleClass="btn btn-secondary"/>
        </div>
    </ui:define>
</ui:composition>
