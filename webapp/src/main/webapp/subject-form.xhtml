<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/template.xhtml">
    <ui:define name="title">Subject Form - Study Habit Tracker</ui:define>
    <ui:define name="content">
        <div class="card">
            <h2 class="page-title">#{subjectBean.editMode ? 'Edit Subject' : 'New Subject'}</h2>

            <h:form id="subjectForm">
                <div class="form-row">
                    <h:outputLabel for="name" value="Subject Name *"/>
                    <h:inputText id="name" value="#{subjectBean.selectedSubject.name}" required="true"
                                 requiredMessage="Subject name is required.">
                        <!-- Validation type 1: standard JSF validator -->
                        <f:validateLength minimum="2" maximum="60"/>
                        <!-- Validation type 2: custom JSF validator -->
                        <f:validator validatorId="subjectNameValidator"/>
                        <!-- Validation type 3: Hibernate/JSR-303 Bean Validation is applied automatically
                             from the @NotBlank / @Size annotations on Subject.name -->
                    </h:inputText>
                    <h:message for="name" styleClass="error-text"/>
                </div>

                <div class="form-row">
                    <h:outputLabel for="description" value="Description"/>
                    <h:inputTextarea id="description" value="#{subjectBean.selectedSubject.description}" style="height:80px;">
                        <f:validateLength maximum="200"/>
                    </h:inputTextarea>
                    <h:message for="description" styleClass="error-text"/>
                </div>

                <h:commandButton value="Save" action="#{subjectBean.save}" styleClass="btn btn-primary" style="margin-right:10px;"/>
                <h:commandButton value="Cancel" action="#{subjectBean.cancel}" styleClass="btn btn-secondary" immediate="true"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
