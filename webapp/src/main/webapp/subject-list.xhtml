<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/template.xhtml">
    <ui:define name="title">Subjects - Study Habit Tracker</ui:define>
    <ui:define name="content">
        <f:metadata>
            <f:viewAction action="#{subjectBean.init}"/>
        </f:metadata>

        <div class="card">
            <h2 class="page-title">Subjects</h2>

            <h:form id="subjectListForm">
                <h:commandLink value="+ Add New Subject" action="#{subjectBean.prepareCreate}"
                                styleClass="btn btn-primary" style="margin-bottom:16px; display:inline-block;"/>

                <h:dataTable value="#{subjectBean.subjects}" var="subj" styleClass="data-table">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{subj.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        #{subj.name}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Description</f:facet>
                        #{subj.description}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandLink value="Edit" action="#{subjectBean.prepareEdit(subj)}" styleClass="btn btn-secondary" style="margin-right:6px;"/>
                        <h:commandLink value="Delete" action="#{subjectBean.delete(subj)}" styleClass="btn btn-danger"
                                       onclick="return confirm('Delete this subject and all its study sessions?');"/>
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
